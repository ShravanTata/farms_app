[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "farms_app"
version = "0.0.1.dev0"
license = {file = "LICENSE.txt"}
description = "GUI Application for neuromechanical simulations using FARMS"
maintainers = [
    {name="Farmers", email="biorob-farms@groupes.epfl.ch"},
]
requires-python = ">=3.10"
dependencies = [
    "numpy <= 1.26.4",
    "imgui_bundle",
    "tqdm",
    "pyyaml",
    "rich",
    "h5py",
    "stevedore",
    # "farms_core @ git+https://github.com/farmsim/farms_core.git",
] # keep in sync with `min_numpy_version` in meson.build

readme = "README.md"
classifiers = [
    "Development Status :: 3 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: C",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific visualization",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Operating System :: MacOS",
]

[project.urls]
Homepage = "https://farmsim.dev"
Documentation = "https://farmsim.dev"
Repository = "https://github.com/farmsim/farms_app.git"
Issues = "https://github.com/farmsim/farms_app/issues"
Changelog = "https://github.com/me/spam/blob/master/CHANGELOG.md"

[project.optional-dependencies]
full = [
     "mujoco",
     "pandas"
]

[project.scripts]
farms-app = "farms_app.cli:main"

[tool.setuptools.packages.find]
where = ["."]  # Change this - look in current directory
include = ["farms_app*"]  # Include farms_app and subpackages

[tool.setuptools.package-data]
farms_app = [
          "assets/fonts/*.ttf",
           "assets/**/*"
]

[project.entry-points."farms.app.extension"]
status_bar = "farms_app.extensions.ui.status_bar:StatusBarExtension"
debug = "farms_app.extensions.ui.logger:DebugExtension"
farmsim = "farms_app.extensions.workflow.farms:FarmsSimulatorExtension"
mujoco = "farms_app.extensions.custom.mujoco_impl:MujocoExtension"
